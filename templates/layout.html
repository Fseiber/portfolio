{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Facundo Seiber · Desarrollo de software{% endblock %}</title>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'portfolio/main.css' %}">
</head>
<body>
  {% include "partials/navbar.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span class="mono">FS / 2026</span>
      <span>Facundo Seiber · Corrientes, Argentina</span>
      <a href="mailto:Facundoseiber.fs@gmail.com">Contactarme <span aria-hidden="true">↗</span></a>
    </div>
  </footer>

  <script>
    const menuButton = document.querySelector(".menu-button");
    const menu = document.querySelector(".nav-links");
    menuButton?.addEventListener("click", () => {
      const open = menu.classList.toggle("is-open");
      menuButton.setAttribute("aria-expanded", open);
    });
    const revealElements = document.querySelectorAll(".reveal");
    const showAll = () => revealElements.forEach((element) => element.classList.add("is-visible"));
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reducedMotion || !("IntersectionObserver" in window)) {
      showAll();
    } else {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
      revealElements.forEach((element) => observer.observe(element));
      window.setTimeout(showAll, 1500);
    }
    document.querySelectorAll(".nav-links a").forEach((link) => link.addEventListener("click", () => {
      menu.classList.remove("is-open");
      menuButton.setAttribute("aria-expanded", "false");
    }));
  </script>
</body>
</html>
